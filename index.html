<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Theyr Voyage Viewer</title>
  <link rel="stylesheet" href="styles.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Theyr Voyage Viewer</h1>
      <p>POST /Voyage with your bearer token and visualize the returned routes.</p>
    </div>
    <div class="status" id="statusPill">Token missing</div>
  </header>

  <main>
    <section class="panel">
      <h2>Connection</h2>
      <div class="grid">
        <label>
          Base URL
          <input id="baseUrl" type="url" placeholder="https://api.t-vos.com/v1.23" />
        </label>
        <label>
          Bearer token
          <input id="token" type="text" placeholder="Paste your token" />
        </label>
        <label>
          Voyage endpoint
          <input id="voyageEndpoint" type="text" placeholder="/Voyage" />
        </label>
        <label>
          Computations endpoint
          <input id="computationsEndpoint" type="text" placeholder="/Voyage/{id}/computations" />
        </label>
        <label>
          Route endpoint
          <input
            id="routeEndpoint"
            type="text"
            placeholder="/VoyageRoute/voyageID?speed=true&direction=true&operational=true&directionUnit=degree&speedUnit=kn&distanceUnit=nm&illustrative=true&computation=computationID"
          />
        </label>
      </div>
      <label class="payload">
        Voyage request payload (JSON)
        <textarea id="voyagePayload" rows="4" placeholder='{"split":10,"page":1}'></textarea>
      </label>
      <div class="pagination">
        <button id="prevPage">Previous page</button>
        <div class="page-info">
          <label>
            Page
            <input id="pageNumber" type="number" min="1" value="1" />
          </label>
        </div>
        <button id="nextPage">Next page</button>
      </div>
      <div class="actions">
        <button id="saveConfig">Save config</button>
        <button id="loadVoyages" class="primary">Load voyages</button>
      </div>
    </section>

    <section class="panel">
      <h2>Voyage Results</h2>
      <div class="layout">
        <div>
          <div id="map"></div>
        </div>
        <div>
          <h3>Voyages</h3>
          <ul id="voyageList" class="voyage-list"></ul>
          <h3>Computations</h3>
          <ul id="computationList" class="voyage-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
